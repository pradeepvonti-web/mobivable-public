name: e2e (PR)

# Tier 1 (render smoke) + Tier 2 (mocked-LLM tool loop) run on every PR.
# Tier 3 (live LLM) is in e2e-nightly.yml.

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

# Cancel queued runs for the same PR / branch when a new push lands.
concurrency:
  group: e2e-pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm install --legacy-peer-deps

      # Playwright caches the browser binaries in ~/.cache/ms-playwright.
      # Cache it ourselves so cold runs aren't 60 s slower than warm ones.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # ── Supabase: stand up a local stack ──
      # The official CLI brings up Postgres, GoTrue, PostgREST, etc. in
      # Docker compose. We apply our migrations against it and feed its
      # URLs into the dev server.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Capture Supabase URLs + keys
        id: supabase
        run: |
          status=$(supabase status --output env)
          SUPA_URL=$(echo "$status" | grep '^API_URL=' | cut -d= -f2- | tr -d '"')
          SUPA_KEY=$(echo "$status" | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '"')
          SUPA_SRK=$(echo "$status" | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '"')
          {
            echo "SUPABASE_URL=$SUPA_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$SUPA_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPA_SRK"
            echo "VITE_SUPABASE_URL=$SUPA_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$SUPA_KEY"
            echo "VITE_SUPABASE_PROJECT_ID=local"
          } >> "$GITHUB_ENV"

      # `supabase start` already applies the migrations in supabase/migrations
      # on first boot. `db reset` is here as a belt-and-braces guarantee that
      # the schema is fresh — the e2e seed runs against a known-empty DB.
      - name: Apply migrations (fresh)
        run: supabase db reset --linked=false

      - name: Build studio
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ env.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ env.VITE_SUPABASE_PROJECT_ID }}
        run: npm run build

      # ── Run the tests ──
      # The dev server stays out of CI because preview build is what we
      # actually ship. `playwright.config.ts` skips its webServer block
      # whenever CI=1; we run vite preview ourselves and point the suite
      # at it.
      - name: Start studio (preview)
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npm run preview -- --port 5173 &
          # Wait for the server to come up
          for i in {1..30}; do
            if curl -fsS http://localhost:5173 >/dev/null; then break; fi
            sleep 1
          done

      - name: Run tier-1 + tier-2 specs
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:5173
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          # Tier-2 fakes the upstream LLM, so a real key here would just
          # be ignored — we explicitly set a stub so detectProvider()
          # picks Anthropic and routes to the URL the spec intercepts.
          ANTHROPIC_API_KEY: e2e-stub-key-not-real
        run: npx playwright test --grep "@tier-1|@tier-2"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop || true
