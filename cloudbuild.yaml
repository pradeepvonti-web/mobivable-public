# Google Cloud Build — Deploy to Cloud Run
# Usage: gcloud builds submit --config cloudbuild.yaml

steps:
  # Step 0: Build and deploy directly to Cloud Run (handles image registry automatically)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        gcloud run deploy mobivable \
          --source . \
          --region us-central1 \
          --platform managed \
          --allow-unauthenticated \
          --memory 1Gi \
          --cpu 1 \
          --min-instances 0 \
          --max-instances 10 \
          --port 8080 \
          --update-env-vars "NODE_ENV=production" \
          --quiet

options:
  logging: CLOUD_LOGGING_ONLY
