<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Flutter Preview Engine</title>
  <script>
    // Force unregister any service workers to avoid aggressive caching of main.dart.js
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
  </script>
  <style>
    /* Reset & full viewport, no scrollbars */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Loading indicator while Flutter boots */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
    }
    .loading .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Loading spinner shown until Flutter takes over -->
  <div id="loading" class="loading">
    <div class="spinner"></div>
  </div>

  <script>
    // Global message queue for schema/theme messages arriving before Flutter boots.
    window._flutterPreviewMessageQueue = [];

    // Define _flutterPreviewOnMessage as a getter/setter to automatically flush the queue
    // as soon as Flutter registers it.
    var _onMessageFn = null;
    Object.defineProperty(window, '_flutterPreviewOnMessage', {
      get: function() {
        return _onMessageFn;
      },
      set: function(fn) {
        _onMessageFn = fn;
        if (typeof fn === 'function') {
          console.log("Flutter preview handler registered. Flushing queue of size:", window._flutterPreviewMessageQueue.length);
          while (window._flutterPreviewMessageQueue.length > 0) {
            var rawMsg = window._flutterPreviewMessageQueue.shift();
            try {
              fn(rawMsg);
            } catch (e) {
              console.error("Failed to forward queued message:", e);
            }
          }
        }
      },
      configurable: true,
      enumerable: true
    });

    // Listen for postMessage from the parent window (the app builder).
    // All four message types must be forwarded — cross-frame JS objects
    // received by Dart's `html.window.onMessage` do not always satisfy
    // `data is Map`, so we stringify here and route through the proven
    // string callback path (`_flutterPreviewOnMessage`).
    var FORWARDED_TYPES = ['SCHEMA_UPDATE', 'THEME_UPDATE', 'SCREEN_CHANGE', 'DEVICE_INFO', 'SCREENSHOT_REQUEST'];
    window.addEventListener('message', function (event) {
      if (!event.data || typeof event.data !== 'object') return;
      var type = event.data.type;
      if (FORWARDED_TYPES.indexOf(type) === -1) return;

      var rawMsg = JSON.stringify(event.data);
      if (window._flutterPreviewOnMessage) {
        window._flutterPreviewOnMessage(rawMsg);
      } else {
        window._flutterPreviewMessageQueue.push(rawMsg);
      }
    });
  </script>

  <!-- Flutter bootstrap -->
  <script>
    window._flutter = {};
    let loaderInstance = null;
    Object.defineProperty(window._flutter, 'loader', {
      get: function() { return loaderInstance; },
      set: function(val) {
        loaderInstance = val;
        if (loaderInstance) {
          // Disable service worker loading dynamically and add cache-busting
          var originalLoad = loaderInstance.load;
          loaderInstance.load = function(options) {
            options = options || {};
            options.serviceWorkerSettings = null;
            var cacheBust = 'main.dart.js?v=' + new Date().getTime();
            options.entrypointUrl = cacheBust;
            options.mainJsPath = cacheBust;
            return originalLoad.call(loaderInstance, options);
          };

          loaderInstance.didCreateEngineInitializer = async function(engineInitializer) {
            let runner = await engineInitializer.initializeEngine();
            await runner.runApp();

            // Hide the loading spinner
            var el = document.getElementById('loading');
            if (el) el.style.display = 'none';
          };
        }
      },
      configurable: true,
      enumerable: true
    });

    // Fallback: the _flutter.loader setter override above can race with
    // flutter_bootstrap.js (which sets didCreateEngineInitializer on the same
    // object). If our didCreateEngineInitializer gets overwritten, the spinner
    // never hides and leaks through over the rendered app. As a safety net,
    // hide #loading the moment the <flutter-view> element appears in the DOM.
    (function hideLoadingWhenFlutterMounts() {
      function hideLoading() {
        var el = document.getElementById('loading');
        if (el) el.style.display = 'none';
      }
      if (document.querySelector('flutter-view')) {
        hideLoading();
        return;
      }
      var observer = new MutationObserver(function() {
        if (document.querySelector('flutter-view')) {
          hideLoading();
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
      // Also force-hide after 15 s as a last resort — by then Flutter has
      // either booted or the user has bigger problems than a stale spinner.
      setTimeout(function() { hideLoading(); observer.disconnect(); }, 15000);
    })();
  </script>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
