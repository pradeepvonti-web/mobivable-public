<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Flutter Preview Engine</title>
  <style>
    /* Reset & full viewport, no scrollbars */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Loading indicator while Flutter boots */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
    }
    .loading .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Loading spinner shown until Flutter takes over -->
  <div id="loading" class="loading">
    <div class="spinner"></div>
  </div>

  <!--
    Message queue: stores postMessage events that arrive before Flutter is ready.
    Flutter will drain this queue on startup and then listen for live events.
  -->
  <script>
    // Global message queue for schema/theme messages arriving before Flutter boots.
    window._flutterPreviewMessageQueue = [];
    // Flag set to true once Flutter's Dart code starts listening.
    window._flutterPreviewReady = false;

    // Listen for postMessage from the parent window (the app builder).
    window.addEventListener('message', function (event) {
      // Basic origin/data validation
      if (!event.data || typeof event.data !== 'object') return;
      var type = event.data.type;
      if (type !== 'SCHEMA_UPDATE' && type !== 'THEME_UPDATE') return;

      if (window._flutterPreviewReady && window._flutterPreviewOnMessage) {
        // Flutter is ready — forward directly.
        window._flutterPreviewOnMessage(JSON.stringify(event.data));
      } else {
        // Queue the message for Flutter to pick up after boot.
        window._flutterPreviewMessageQueue.push(JSON.stringify(event.data));
      }
    });
  </script>

  <!-- Flutter bootstrap -->
  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function () {
      _flutter.loader.load({
        onEntrypointLoaded: async function (engineInitializer) {
          let runner = await engineInitializer.initializeEngine();
          await runner.runApp();
          // Hide the loading spinner once Flutter has started.
          var el = document.getElementById('loading');
          if (el) el.style.display = 'none';
        }
      });
    });
  </script>
</body>
</html>
