<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Flutter Preview Engine</title>
  <style>
    /* Reset & full viewport, no scrollbars */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Loading indicator while Flutter boots */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
    }
    .loading .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Loading spinner shown until Flutter takes over -->
  <div id="loading" class="loading">
    <div class="spinner"></div>
  </div>

  <script>
    // Global message queue for schema/theme messages arriving before Flutter boots.
    window._flutterPreviewMessageQueue = [];

    // Define _flutterPreviewOnMessage as a getter/setter to automatically flush the queue
    // as soon as Flutter registers it.
    var _onMessageFn = null;
    Object.defineProperty(window, '_flutterPreviewOnMessage', {
      get: function() {
        return _onMessageFn;
      },
      set: function(fn) {
        _onMessageFn = fn;
        if (typeof fn === 'function') {
          console.log("Flutter preview handler registered. Flushing queue of size:", window._flutterPreviewMessageQueue.length);
          while (window._flutterPreviewMessageQueue.length > 0) {
            var rawMsg = window._flutterPreviewMessageQueue.shift();
            try {
              fn(rawMsg);
            } catch (e) {
              console.error("Failed to forward queued message:", e);
            }
          }
        }
      },
      configurable: true,
      enumerable: true
    });

    // Listen for postMessage from the parent window (the app builder).
    window.addEventListener('message', function (event) {
      // Basic origin/data validation
      if (!event.data || typeof event.data !== 'object') return;
      var type = event.data.type;
      if (type !== 'SCHEMA_UPDATE' && type !== 'THEME_UPDATE' && type !== 'SCREEN_CHANGE' && type !== 'DEVICE_INFO') return;

      console.log('[flutter-preview host] received', type, 'onMessageExists=', (typeof window._flutterPreviewOnMessage === 'function'), 'screens=', (event.data.schema && event.data.schema.screens && event.data.schema.screens.length));

      var rawMsg = JSON.stringify(event.data);
      if (window._flutterPreviewOnMessage) {
        window._flutterPreviewOnMessage(rawMsg);
      } else {
        window._flutterPreviewMessageQueue.push(rawMsg);
      }
    });
  </script>

  <!-- Flutter bootstrap -->
  <script>
    window._flutter = {};
    let loaderInstance = null;
    Object.defineProperty(window._flutter, 'loader', {
      get: function() { return loaderInstance; },
      set: function(val) {
        loaderInstance = val;
        if (loaderInstance) {
          loaderInstance.didCreateEngineInitializer = async function(engineInitializer) {
            let runner = await engineInitializer.initializeEngine();
            await runner.runApp();
            
            // Hide the loading spinner
            var el = document.getElementById('loading');
            if (el) el.style.display = 'none';

            // Notify parent that Flutter is ready so it can re-send latest state.
            try {
              window.parent.postMessage({ type: 'FLUTTER_READY' }, '*');
            } catch (e) { /* ignore */ }
          };
        }
      },
      configurable: true,
      enumerable: true
    });
  </script>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
